name: Rust
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p nemesia-wasm --target wasm32-unknown-unknown -- -D warnings
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-20 --profile minimal
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: bash tools/fuzz-index.sh 20
      - run: git diff --exit-code fuzz/Cargo.lock
