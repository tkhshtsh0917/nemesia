name: Publish Rust API reference
run-name: Rust API reference for ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Nemesia release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rustdoc-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      landing-sha256: ${{ steps.docs.outputs.landing-sha256 }}
    steps:
      - name: Check published tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' | grep -Fx true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: presentation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release
          persist-credentials: false
      - name: Build API reference
        id: docs
        working-directory: release
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bash ../presentation/tools/rustdoc.sh target/rustdoc-site
          landing_sha="$(sha256sum target/rustdoc-site/index.html | awk '{print $1}')"
          jq -n --arg tag "$TAG" --arg revision "$(git rev-parse HEAD)" \
            --arg presentationRevision "$GITHUB_SHA" --arg landingSha256 "$landing_sha" \
            '{tag: $tag, revision: $revision, presentationRevision: $presentationRevision, landingSha256: $landingSha256}' \
            > target/rustdoc-site/release.json
          echo "landing-sha256=$landing_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: release/target/rustdoc-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Require the current release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: test "$(gh release view --json tagName --jq .tagName)" = "$TAG"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: pages
      - name: Verify deployed reference and release
        env:
          PAGE: ${{ steps.pages.outputs.page_url }}
          TAG: ${{ inputs.tag }}
          LANDING_SHA: ${{ needs.build.outputs.landing-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE%/}"
          [[ "$LANDING_SHA" =~ ^[a-f0-9]{64}$ ]]
          for attempt in {1..12}; do
            query="run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            if curl --max-time 15 -fsS "$base/release.json?$query" |
              jq -e --arg tag "$TAG" --arg revision "$GITHUB_SHA" --arg sha "$LANDING_SHA" \
                '.tag == $tag and .presentationRevision == $revision and .landingSha256 == $sha' >/dev/null &&
              curl --max-time 15 -fsS "$base/?$query" -o "$RUNNER_TEMP/rustdoc-index.html" &&
              printf '%s  %s\n' "$LANDING_SHA" "$RUNNER_TEMP/rustdoc-index.html" | sha256sum -c -; then
              curl --max-time 15 -fsS "$base/nemesia_engine/index.html" -o /dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1
