name: Publish native and WASM artifacts
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  assets:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify version and build artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: bash tools/package.sh "$PLATFORM" "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nemesia-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum nemesia-linux-x86_64 nemesia-macos-aarch64 nemesia_wasm.wasm nemesia-abi.json nemesia-licenses.tar.gz nemesia-rustdoc.tar.gz > SHA256SUMS
          gh release create "$TAG" nemesia-linux-x86_64 nemesia-macos-aarch64 nemesia_wasm.wasm nemesia-abi.json nemesia-licenses.tar.gz nemesia-rustdoc.tar.gz SHA256SUMS --verify-tag --generate-notes
    outputs:
      tag: ${{ github.ref_name }}
  notify:
    needs: publish
    if: vars.NEMESIA_DEMO_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          client-id: ${{ vars.NEMESIA_DEMO_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEMESIA_DEMO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nemesia-demo
          permission-actions: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEMO: ${{ github.repository_owner }}/nemesia-demo
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh workflow run pages.yml --repo "$DEMO" --ref main --field tag="$TAG" --field automatic=true
