[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkhshtsh0917/nemesia"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-normalization = "=0.1.26"
nemesia-index = { path = "crates/nemesia-index" }
nemesia-engine = { path = "crates/nemesia-engine" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
